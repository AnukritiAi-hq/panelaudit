[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "panelaudit"
version = "1.0.0"
description = "Panel-first pharmacogenomic audit: what does this assay report for someone who carries X?"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA", "NOTICE"]
authors = [{ name = "Abhimanyu R B", email = "abhi@anukritiai.com" }]
keywords = ["pharmacogenomics", "CPIC", "genotyping panel", "star alleles", "health equity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
panelaudit = "panelaudit.cli:main"

[tool.setuptools]
packages = ["panelaudit"]

[tool.setuptools.package-data]
panelaudit = ["cache/*.json", "data/*/*.tsv", "presets/*.json"]
